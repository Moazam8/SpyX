name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the Android platform scaffolding, then drop in our app code.
      - run: flutter create app --project-name dailylife --org com.moazam --platforms android
      - run: cp lib/main.dart app/lib/main.dart
      - run: cp pubspec.yaml app/pubspec.yaml

      - run: cd app && flutter pub get
      - run: cd app && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dailylife-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
